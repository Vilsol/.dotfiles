name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: flake check (alejandra, statix, deadnix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
            substituters = https://cache.nixos.org/ https://cuda-maintainers.cachix.org https://attic.xuyh0120.win/lantian https://hyprland.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cuda-maintainers.cachix.org-1:0dq3bujKpuEPMCX6U4WylrUDZ9JyUG0VpVZa7CNfq5E= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=

      - run: nix flake check --print-build-logs

  evaluate:
    name: evaluate ${{ matrix.machine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        machine: [cortex, framework]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org/ https://cuda-maintainers.cachix.org https://attic.xuyh0120.win/lantian https://hyprland.cachix.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= cuda-maintainers.cachix.org-1:0dq3bujKpuEPMCX6U4WylrUDZ9JyUG0VpVZa7CNfq5E= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=

      # Evaluation only. A full `nix build` of the toplevel would compile
      # linux-cachyos-latest-lto-zen4 whenever the lantian cache misses, which
      # does not fit in a hosted runner's time or disk budget. Evaluating
      # catches broken imports, missing module args and option type errors --
      # the failures this repo has actually hit.
      - name: evaluate toplevel derivation
        run: |
          nix eval --raw \
            ".#nixosConfigurations.${{ matrix.machine }}.config.system.build.toplevel.drvPath"
          echo
