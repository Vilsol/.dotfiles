################
### MONITORS ###
################

monitor= DP-2, 3840x2160@60, 0x0,    1, bitdepth, 10
monitor= DP-3, 3840x2160@60, 3840x0, 1, bitdepth, 10

###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

#################
### AUTOSTART ###
#################

# Set wallpaper after monitors are initialized
exec-once = sleep 2 && hyprctl hyprpaper preload ~/.background-image.png
exec-once = sleep 2 && hyprctl hyprpaper wallpaper "DP-3,~/.background-image.png"
exec-once = sleep 2 && hyprctl hyprpaper wallpaper "DP-2,~/.background-image.png"

###############
### PLUGINS ###
###############

plugin {
    hyprbars {
        # bar height
        bar_height = 25
        bar_blur = true
        
        # bar colors
        col.text = rgb(ffffff)
        bar_text_font_family = monospace
        bar_text_size = 11
        
        # buttons
        bar_button_padding = 5
        bar_padding = 10
        bar_precedence_over_border = true
        bar_part_of_window = true
        
        # window title alignment (left, center, right)
        bar_text_align = center
        
        # hide bars on fullscreen windows
        hide_when_fullscreen = true
        
        # Example buttons (uncomment and customize)
        hyprbars-button = rgb(ff4040), 12, , hyprctl dispatch killactive
        hyprbars-button = rgb(eeee11), 12, , hyprctl dispatch fullscreen 1
    }
    
    split-monitor-workspaces {
        count = 10
        keep_focused = 0
        enable_notifications = 0
    }
}


#####################
### LOOK AND FEEL ###
#####################

general { 
    gaps_in = 0
    gaps_out = 0

    border_size = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle
}

decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    #drop_shadow = true
    #shadow_range = 4
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)

    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 3, default  # Faster workspace switching (was 6)
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

misc { 
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    focus_on_activate = true
    middle_click_paste = false
}


#############
### INPUT ###
#############

input {
    kb_layout = us,lv
    kb_variant = ,apostrophe
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = -0.85 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.6
}

binds {
    scroll_event_delay = 1000
}

####################
### KEYBINDINGSS ###
####################

$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, L, exec, lock-screen  # Lock screen
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6
bind = $mainMod, 7, split-workspace, 7
bind = $mainMod, 8, split-workspace, 8
bind = $mainMod, 9, split-workspace, 9
bind = $mainMod, 0, split-workspace, 10

bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, split-movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, split-movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, split-movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, split-movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, split-movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, split-movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, split-movetoworkspacesilent, 10

bind = $mainMod, bracketleft, split-workspace, r-1
bind = $mainMod, bracketright, split-workspace, r+1

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, split-workspace, r-1
bind = $mainMod, mouse_up, split-workspace, r+1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Utils

bindd = SUPER, W, Window info, exec, hyprctl activewindow -j | jq --sort-keys | wl-copy

# Screenshots with Swappy annotation
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, grim -g "$(hyprctl activewindow -j | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | swappy -f -
bind = CTRL, Print, exec, grim - | swappy -f -

# Warp terminal - <Shift><Alt>t - bash -c 'xdg-open warp://action/new_tab?path=~ && wmctrl -a \"vilsol@\"'
bind = SHIFT ALT, T, exec, bash -c 'xdg-open warp://action/new_tab?path=~ && wmctrl -a \"vilsol@\"'

# Vicinae
bind = $mainMod, Space, exec, vicinae toggle
layerrule {
    name = layerrule-1
    blur = on
    ignore_alpha = 0
    no_anim = on
    match:namespace = vicinae
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = hyprbars:no_bar 1, match:class ^(firefox)$
windowrule = hyprbars:no_bar 1, match:class ^(firefox-developer-edition)$
windowrule = hyprbars:no_bar 1, match:class ^(google-chrome)$
windowrule = hyprbars:no_bar 1, match:class ^(chromium)$
windowrule = hyprbars:no_bar 1, match:class ^(brave-browser)$
windowrule = hyprbars:no_bar 1, match:class ^(org.telegram.desktop)$
windowrule = hyprbars:no_bar 1, match:class ^(cursor)$
windowrule = hyprbars:no_bar 1, match:class ^(code)$
windowrule = hyprbars:no_bar 1, match:class ^(Code)$
windowrule = hyprbars:no_bar 1, match:class ^(jetbrains-(goland|webstorm|pycharm|datagrip|intellij))$


# Telegram on DP-2 WS1
windowrule = workspace 1, monitor DP-2, match:class ^(org.telegram.desktop)$

# Vesktop on DP-2 WS2
windowrule = workspace 2, monitor DP-2, match:class ^(vesktop)$

windowrule {
    name = 1password-popup
    match:class = ^(1password)$
    
    float = on
    center = on

    min_size = 900 900
    no_max_size = on

    border_color = rgb(FF0000)
    border_size = 10
    # stay_focused = on
    persistent_size = on
    keep_aspect_ratio = on
    no_screen_share = on
    render_unfocused = on
}

windowrule {
    name = telegram-media-viewer
    match:class = ^(org.telegram.desktop)$
    match:title = ^(Media viewer)$
    
    float = on
    size = 80% 80%
    center = on
    fullscreen = off
}

windowrule {
    name = windowrule-3
    suppress_event = maximize
    match:class = .*
}

debug {
    # overlay = true
    disable_logs = true
    disable_time = true
}

xwayland {
    force_zero_scaling = true
}
